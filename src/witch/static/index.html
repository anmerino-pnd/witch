<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witch - Twitch VOD & Live Player</title>
    <link rel="stylesheet" href="app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Witch</h1>
            <p>Local-first Twitch VOD & Live player with custom navigation</p>
        </header>

        <div class="url-input-container">
            <input type="text" id="vod-url" placeholder="https://www.twitch.tv/ibai or https://www.twitch.tv/videos/12345">
            <button id="load-btn">Load</button>
        </div>
        
        <div id="error-msg" class="error-msg hidden"></div>
        
        <div id="live-indicator" class="hidden">
            <span class="live-dot"></span> LIVE
        </div>

        <div class="player-wrapper">
            <video id="video-player" controls></video>
        </div>
        
        <div id="hls-url-container" class="hidden">
            <label>HLS Source <span class="dim">(may expire)</span>:</label>
            <div class="hls-row">
                <input type="text" id="hls-url-input" readonly>
                <button id="copy-hls-btn">Copy</button>
            </div>
        </div>
        
        <div class="controls-panel">
            <div class="time-display">
                <span id="current-time">00:00:00</span> / <span id="total-time">00:00:00</span>
            </div>
            
            <div class="playback-buttons">
                <div id="vod-skip-back-container" class="skip-container">
                    <button id="skip-back-3" class="skip-btn">-<span class="sb3-val">30</span>s</button>
                    <button id="skip-back-2" class="skip-btn">-<span class="sb2-val">15</span>s</button>
                    <button id="skip-back-1" class="skip-btn">-<span class="sb1-val">5</span>s</button>
                </div>
                
                <button id="play-pause" class="play-btn">▶ / ❚❚</button>
                
                <div id="vod-skip-fwd-container" class="skip-container">
                    <button id="skip-fwd-1" class="skip-btn">+<span class="sf1-val">5</span>s</button>
                    <button id="skip-fwd-2" class="skip-btn">+<span class="sf2-val">15</span>s</button>
                    <button id="skip-fwd-3" class="skip-btn">+<span class="sf3-val">30</span>s</button>
                </div>
            </div>
            
            <div class="timestamp-selector" id="vod-timestamp-container">
                <label>Timestamp:</label>
                <div class="ts-inputs">
                    <input type="number" id="ts-h" min="0" placeholder="HH"><span>:</span>
                    <input type="number" id="ts-m" min="0" max="59" placeholder="MM"><span>:</span>
                    <input type="number" id="ts-s" min="0" max="59" placeholder="SS">
                </div>
                <button id="go-btn">Go</button>
            </div>
        </div>

        <div class="settings-panel" id="vod-settings-panel">
            <h3>Skip Intervals</h3>
            <div class="settings-grid">
                <div class="settings-row">
                    <label>Backward:</label>
                    <input type="number" id="sb3-input" value="30">
                    <input type="number" id="sb2-input" value="15">
                    <input type="number" id="sb1-input" value="5">
                </div>
                <div class="settings-row">
                    <label>Forward:</label>
                    <input type="number" id="sf1-input" value="5">
                    <input type="number" id="sf2-input" value="15">
                    <input type="number" id="sf3-input" value="30">
                </div>
            </div>
            <button id="save-settings-btn">Save Settings</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="app.js"></script>
</body>
</html>
