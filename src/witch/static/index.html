<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witch - Twitch VOD & Live Player</title>
    <link rel="icon" type="image/png" href="witch.png">
    <link rel="stylesheet" href="app.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1>Witch</h1>
        <p>Local-first Twitch & YouTube player with custom navigation</p>
    </header>
    <div class="main-layout" id="main-layout">
        <aside class="sidebar">
            <div class="settings-panel history-panel" id="watch-history-panel">
                <h3>Last Viewed Videos</h3>
                <ul id="watch-history-list" class="history-list">
                    <!-- Populated via JS -->
                </ul>
            </div>
        </aside>

        <main class="app-container" id="app-container">
            <div class="url-input-container">
                <input type="text" id="vod-url" placeholder="https://www.twitch.tv/ibai or https://www.twitch.tv/videos/12345">
                <button id="load-btn">Load</button>
            </div>
            
            <div id="error-msg" class="error-msg hidden"></div>
            
            <div id="live-indicator" class="hidden">
                <span class="live-dot"></span> LIVE
            </div>

            <div class="player-wrapper">
                <video id="video-player" controls></video>
                <div id="youtube-player" class="hidden"></div>
            </div>
            
            <div id="hls-url-container" class="hidden">
                <label>HLS Source <span class="dim">(may expire)</span>:</label>
                <div class="hls-row">
                    <input type="text" id="hls-url-input" readonly>
                    <button id="copy-hls-btn">Copy</button>
                </div>
            </div>
            
            <div class="controls-panel">
                <div class="time-display">
                    <span id="current-time">00:00:00</span> / <span id="total-time">00:00:00</span>
                </div>
                
                <div class="playback-buttons">
                    <div id="vod-skip-back-container" class="skip-container">
                        <button id="skip-back-3" class="skip-btn">-<span class="sb3-val">30</span>s</button>
                        <button id="skip-back-2" class="skip-btn gold-btn">-<span class="sb2-val">15</span>s</button>
                        <button id="skip-back-1" class="skip-btn">-<span class="sb1-val">5</span>s</button>
                    </div>
                    
                    <button id="play-pause" class="play-btn" title="Play/Pause (Space)">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        /
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <button id="theater-btn" class="secondary-btn" title="Theater Mode (T)">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="vertical-align: middle; margin-right: 4px;">
                            <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/>
                        </svg>
                        Theater
                    </button>
                    
                    <div id="vod-skip-fwd-container" class="skip-container">
                        <button id="skip-fwd-1" class="skip-btn">+<span class="sf1-val">5</span>s</button>
                        <button id="skip-fwd-2" class="skip-btn gold-btn">+<span class="sf2-val">15</span>s</button>
                        <button id="skip-fwd-3" class="skip-btn">+<span class="sf3-val">30</span>s</button>
                    </div>
                </div>
                
                <div class="timestamp-selector" id="vod-timestamp-container">
                    <label>Timestamp:</label>
                    <div class="ts-inputs">
                        <input type="number" id="ts-h" min="0" placeholder="HH"><span>:</span>
                        <input type="number" id="ts-m" min="0" max="59" placeholder="MM"><span>:</span>
                        <input type="number" id="ts-s" min="0" max="59" placeholder="SS">
                    </div>
                    <button id="go-btn">Go</button>
                    <button id="watch-again-btn" class="secondary-btn hidden" style="margin-left: 1rem;">Watch Again</button>
                </div>
            </div>

            <div class="settings-panel" id="vod-settings-panel">
                <h3>Skip Intervals</h3>
                <div class="settings-grid">
                    <div class="settings-row">
                        <label>Backward:</label>
                        <input type="number" id="sb3-input" value="30">
                        <input type="number" id="sb2-input" value="15">
                        <input type="number" id="sb1-input" value="5">
                    </div>
                    <div class="settings-row">
                        <label>Forward:</label>
                        <input type="number" id="sf1-input" value="5">
                        <input type="number" id="sf2-input" value="15">
                        <input type="number" id="sf3-input" value="30">
                    </div>
                </div>
                <div class="settings-actions">
                    <button id="save-settings-btn">Save Settings</button>
                    <button id="clear-cache-btn" class="secondary-btn">Clear Watch History</button>
                </div>
            </div>
        </main>
        
        <!-- Empty spacer to ensure the player stays truly centered -->
        <aside class="sidebar right-spacer"></aside>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="app.js"></script>
</body>
</html>
