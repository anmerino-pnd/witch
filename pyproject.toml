[project]
name = "witch"
version = "0.1.0"
description = "A local-first Twitch VOD player with custom HLS navigation controls"
readme = "README.md"
authors = [
    { name = "Angel Merino", email = "acedeno00@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
witch = "witch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
